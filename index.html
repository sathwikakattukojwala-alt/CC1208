
<!DOCTYPE html>
<html>
<head>
    <title> Static Web Page</title>
</head>
<body>
    <header>
        <h1>My HTML Website</h1>
        <nav>
            <ul>
                <li><a href="#about">About Me</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="about">
            <h2>About This Project</h2>
            <p>This is a completely raw HTML document. </p>
        </section>        
        <section id="contact">
            <p>Fill out the additional information:</p>
            
            <form action="#" method="POST">
                <p>
                    <label for="username">Full Name:</label><br>
                    <input type="text" id="username" name="username" required>
                </p>
                <p>
                    <label for="useremail">Email Address:</label><br>
                    <input type="email" id="useremail" name="useremail" required>
                </p>
                <p>
                    <label for="usermessage">Message Details:</label><br>
                    <textarea id="usermessage" name="usermessage" rows="4" cols="40" required></textarea>
                </p>
                <p>
                    <input type="submit" value="Submit Form">
                    <input type="reset" value="Clear Form Entries">
                </p>
            </form>
        </section>

    </main>

    <hr>
</body>
</html>
